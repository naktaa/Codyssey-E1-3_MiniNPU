<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Python 2차원 리스트와 1차원 리스트의 객체 참조 경로 비교</title>
  <desc id="desc">2차원 리스트의 matrix row column 접근은 바깥 리스트와 행 리스트를 거치고, 1차원 리스트의 flat index 접근은 한 리스트에서 값 객체로 이동하는 구조를 비교한 그림</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#cf222e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0969da"/>
    </marker>
  </defs>
  <rect width="1000" height="610" rx="18" fill="#ffffff"/>
  <rect x="1" y="1" width="998" height="608" rx="17" fill="none" stroke="#d0d7de" stroke-width="2"/>

  <g font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#24292f">
    <text x="500" y="40" text-anchor="middle" font-size="23" font-weight="700">Python 리스트의 객체 참조 경로</text>
    <text x="500" y="65" text-anchor="middle" font-size="13" fill="#57606a">두 방식 모두 숫자 객체의 참조를 저장하지만, 중간 리스트 접근 단계가 다릅니다.</text>

    <rect x="30" y="88" width="450" height="390" rx="15" fill="#fff8f8" stroke="#ff8182" stroke-width="2"/>
    <text x="255" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#a40e26">2차원 리스트</text>
    <text x="255" y="147" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">matrix[row][column]</text>

    <text x="55" y="202" font-size="15" font-weight="700">matrix</text>
    <line x1="108" y1="197" x2="139" y2="197" stroke="#cf222e" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="145" y="166" width="290" height="64" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/>
    <line x1="240" y1="166" x2="240" y2="230" stroke="#d0d7de"/>
    <line x1="340" y1="166" x2="340" y2="230" stroke="#d0d7de"/>
    <text x="192" y="194" text-anchor="middle" font-size="13">행 0 참조</text>
    <text x="290" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#a40e26">행 row 참조</text>
    <text x="387" y="194" text-anchor="middle" font-size="13">…</text>
    <text x="290" y="218" text-anchor="middle" font-size="11" fill="#a40e26">① 바깥 리스트 조회</text>

    <line x1="290" y1="230" x2="290" y2="273" stroke="#cf222e" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="145" y="280" width="290" height="64" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="2"/>
    <line x1="240" y1="280" x2="240" y2="344" stroke="#d0d7de"/>
    <line x1="340" y1="280" x2="340" y2="344" stroke="#d0d7de"/>
    <text x="192" y="308" text-anchor="middle" font-size="13">값 0 참조</text>
    <text x="290" y="308" text-anchor="middle" font-size="13" font-weight="700" fill="#a40e26">값 column 참조</text>
    <text x="387" y="308" text-anchor="middle" font-size="13">…</text>
    <text x="290" y="332" text-anchor="middle" font-size="11" fill="#a40e26">② 행 리스트 조회</text>

    <line x1="290" y1="344" x2="290" y2="387" stroke="#cf222e" stroke-width="3" marker-end="url(#arrow-red)"/>
    <rect x="218" y="394" width="144" height="48" rx="24" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="290" y="424" text-anchor="middle" font-size="14" font-weight="700">숫자 객체</text>
    <text x="255" y="464" text-anchor="middle" font-size="13" fill="#6e7781">바깥 리스트 → 행 리스트 → 값 객체</text>

    <rect x="520" y="88" width="450" height="390" rx="15" fill="#f6faff" stroke="#54aeff" stroke-width="2"/>
    <text x="745" y="122" text-anchor="middle" font-size="19" font-weight="700" fill="#0550ae">1차원 리스트</text>
    <text x="745" y="147" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">flat[index]</text>

    <text x="545" y="241" font-size="15" font-weight="700">flat</text>
    <line x1="582" y1="236" x2="613" y2="236" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <rect x="620" y="201" width="305" height="70" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <line x1="720" y1="201" x2="720" y2="271" stroke="#d0d7de"/>
    <line x1="825" y1="201" x2="825" y2="271" stroke="#d0d7de"/>
    <text x="670" y="232" text-anchor="middle" font-size="13">값 0 참조</text>
    <text x="772" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0550ae">값 index 참조</text>
    <text x="875" y="232" text-anchor="middle" font-size="13">…</text>
    <text x="772" y="256" text-anchor="middle" font-size="11" fill="#0550ae">① 한 리스트 조회</text>

    <line x1="772" y1="271" x2="772" y2="359" stroke="#0969da" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <rect x="700" y="366" width="144" height="48" rx="24" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="772" y="396" text-anchor="middle" font-size="14" font-weight="700">숫자 객체</text>
    <text x="745" y="464" text-anchor="middle" font-size="13" fill="#6e7781">한 리스트 → 값 객체</text>

    <rect x="58" y="505" width="884" height="78" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="82" y="532" font-size="13" font-weight="700">해석</text>
    <text x="82" y="554" font-size="13">• 2차원 방식은 행 참조와 값 참조를 차례로 조회하고, 1차원 방식은 한 리스트에서 값 참조를 조회합니다.</text>
    <text x="82" y="575" font-size="13">• 1차원 변환 시간과 추가 리스트 메모리는 이번 순수 MAC 측정 구간에서 제외했습니다.</text>
  </g>
</svg>
